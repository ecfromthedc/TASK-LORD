<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TASK LORD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{
    /* TASK LORD — BEDROCK & DIAMOND. Cool graphite-blue bedrock = focus + weight;
       steel-cyan = the active dig; ONE amber-gold strike = the primary action (will);
       diamond-cyan over old-gold = the unearthed reward on done; red = alert only.
       Warmth is rationed to the strike. See GOAL-COLOR.md for the rationale. */
    --bg:#0A0E14; --bg-2:#0E131C;
    --surface:#121A25; --surface-hi:#18222F;
    --line:rgba(234,240,246,.10); --line-hi:rgba(234,240,246,.22);
    --ink:#EAF0F6; --ink-mid:rgba(234,240,246,.62); --ink-lo:rgba(234,240,246,.40); --ink-faint:rgba(234,240,246,.26);
    /* general UI accent = calm steel-cyan (focus); warmth is rationed to --strike */
    --accent:#3E9BC4; --accent-dim:#2E6E8C;
    --focus:#3E9BC4; --focus-dim:#2E6E8C;
    --strike:#F0A33C; --strike-dim:#B97E2E;
    --diamond:#9FE8E0; --diamond-hi:#CFF4F0;
    --gold:#C9A85F; --red:#C8301C; --magenta:#E100C3;
    --st-backlog:#5A6B7A; --st-prog:#3E9BC4; --st-blocked:#C8301C; --st-done:#9FE8E0;
    --urgent:#C8301C;
    --display:'Helvetica Neue','Inter','Helvetica',Arial,sans-serif;
    --serif:'Bodoni Moda','Playfair Display',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace;
    --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;
    background:
      radial-gradient(820px 560px at 88% -10%, rgba(62,155,196,.10), transparent 62%),
      radial-gradient(680px 520px at 2% 112%, rgba(60,120,120,.06), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  ::selection{background:rgba(62,155,196,.28)}

  /* ---- masthead ---- */
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:28px;
    padding:18px 30px 16px;background:linear-gradient(180deg,rgba(10,10,12,.96),rgba(10,10,12,.7));
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .brand{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.025em;
    text-transform:uppercase;color:var(--ink);white-space:nowrap;line-height:1}
  .brand b{color:var(--accent);font-weight:800}
  .vr{width:1px;height:18px;background:var(--line-hi);align-self:center}
  .kick{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--ink-faint);white-space:nowrap;align-self:center;line-height:1.35}
  .stat{font-family:var(--mono);font-size:10.5px;color:var(--ink-lo);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat .live{color:var(--accent-dim)}
  .grow{flex:1}
  .search{appearance:none;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 12px;border-radius:0;
    width:200px;outline:none;transition:border-color .15s,width .2s}
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{border-color:var(--line-hi);width:240px}
  .toggles{display:flex;gap:18px;align-items:center}
  .tg{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);
    cursor:pointer;user-select:none;padding-bottom:3px;border-bottom:1px solid transparent;transition:.15s}
  .tg:hover{color:var(--ink-mid)}
  .tg.on{color:var(--ink);border-bottom-color:var(--accent)}

  /* ---- area rail ---- */
  .rail{display:flex;gap:22px;padding:11px 30px;border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .area{font-size:11px;letter-spacing:.04em;color:var(--ink-faint);cursor:pointer;
    white-space:nowrap;transition:.15s}
  .area .n{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-left:6px}
  .area:hover{color:var(--ink-mid)}
  .area.on{color:var(--ink)} .area.on .n{color:var(--accent-dim)}

  /* ---- board ---- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
    border-bottom:1px solid var(--line)}
  @media(max-width:1080px){.board{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.board{grid-template-columns:1fr}}
  .col{background:var(--bg);min-height:60vh;padding:0 0 40px;min-width:0}
  .col-h{position:sticky;top:71px;z-index:10;display:flex;align-items:baseline;gap:10px;
    padding:16px 22px 12px;background:var(--bg);border-top:2px solid var(--ch);
    margin-bottom:2px}
  .col-h .ix{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--accent-dim);font-variant-numeric:tabular-nums}
  .col-h .sl{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin:0 2px}
  .col-h .t{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-mid)}
  .col-h .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-lo);margin-left:auto;font-variant-numeric:tabular-nums}
  .col.backlog{--ch:var(--st-backlog)} .col.in_progress{--ch:var(--st-prog)}
  .col.blocked{--ch:var(--st-blocked)} .col.done{--ch:var(--st-done)}
  .stack{display:flex;flex-direction:column;gap:8px;padding:0 16px;min-width:0}

  /* ---- card ---- */
  .card{position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:0;padding:14px 16px 14px 18px;transition:background .15s,border-color .15s;min-width:0}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--sp);opacity:.9}
  .card.s-backlog{--sp:var(--st-backlog)} .card.s-in_progress{--sp:var(--st-prog)}
  .card.s-blocked{--sp:var(--st-blocked)} .card.s-done{--sp:var(--st-done)}
  /* done = the unearthed diamond: a diamond-cyan facet over an old-gold seal base */
  .card.s-done::before{width:3px;background:linear-gradient(180deg,var(--diamond-hi),var(--diamond) 42%,var(--gold));opacity:1}
  /* one-shot facet glint — plays once on load only (gated by body.booting), never ambient */
  @keyframes facet{0%{opacity:0;transform:translateY(-110%)}38%{opacity:.85}100%{opacity:0;transform:translateY(125%)}}
  body.booting .card.s-done::after{content:"";position:absolute;left:0;top:0;width:3px;height:42%;
    background:linear-gradient(180deg,transparent,var(--diamond-hi),transparent);
    animation:facet .9s ease-out 1;pointer-events:none;z-index:2}
  .card:hover{background:var(--surface-hi);border-color:var(--line-hi)}

  .eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:7px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-lo);min-height:12px}
  .eyebrow .ident{letter-spacing:.08em;color:var(--ink-faint)}
  .eyebrow .sep{color:var(--ink-faint);opacity:.55}
  .eyebrow .prio.urgent{color:var(--urgent)} .eyebrow .prio.high{color:var(--accent)}

  .title{font-family:var(--display);font-size:14.5px;font-weight:600;color:var(--ink);
    letter-spacing:-.012em;margin-bottom:6px;word-break:break-word;line-height:1.25}
  .summary{font-size:12px;color:var(--ink-mid);margin-bottom:2px}
  .line{font-size:11.5px;margin-top:6px;color:var(--ink-mid)}
  .line .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-lo);margin-right:7px}
  .line.blocked .k{color:var(--st-blocked)}
  .line.next .k{color:var(--accent-dim)}

  .gutter{display:flex;gap:14px;margin-top:11px;font-family:var(--mono);font-size:10px;
    color:var(--ink-faint);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .path{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:7px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}

  /* the strike: the single warm amber-gold action — the shovel going in.
     Calm low-ink at rest; on hover the whole row turns strike-amber and a
     hairline underline draws in from the left (<150ms). One warm thing per card. */
  .act{position:relative;display:flex;align-items:center;width:100%;margin-top:12px;padding:11px 0 9px;
    border-top:1px solid var(--line);background:none;border-left:none;border-right:none;
    border-bottom:none;cursor:pointer;color:var(--ink-mid);font-family:var(--sans);
    font-size:11.5px;letter-spacing:.02em;text-align:left;transition:color .14s}
  .act::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:100%;
    background:var(--strike);transform:scaleX(0);transform-origin:left;transition:transform .14s ease-out}
  /* the arrow is the one warm anchor present at rest — the shovel ready in the
     ground — quietly amber, then the whole row bites strike-amber on hover */
  .act .arrow{margin-left:auto;color:var(--strike);opacity:.7;transition:transform .14s,color .14s,opacity .14s}
  .card:hover .act{color:var(--strike)}
  .card:hover .act .arrow{color:var(--strike);opacity:1;transform:translateX(3px)}
  .card:hover .act::after{transform:scaleX(1)}

  .dismiss{position:absolute;top:9px;right:10px;width:18px;height:18px;display:flex;
    align-items:center;justify-content:center;cursor:pointer;color:var(--ink-faint);
    font-size:15px;line-height:1;opacity:0;transition:.15s;background:none;border:none;font-family:var(--sans)}
  .card:hover .dismiss{opacity:.7}
  .dismiss:hover{opacity:1;color:var(--st-blocked)}

  /* ---- triage / multi-select clear ---- */
  .colsel{display:none;margin-left:14px;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-faint);background:none;border:none;cursor:pointer;padding:0;transition:color .14s}
  body.triage .colsel{display:inline}
  .colsel:hover{color:var(--accent)}
  .cbx{display:none;position:absolute;top:11px;right:12px;width:14px;height:14px;
    border:1px solid var(--line-hi);background:var(--bg-2);transition:background .12s,border-color .12s}
  body.triage .cbx{display:block}
  body.triage .card{cursor:pointer;user-select:none}
  body.triage .act,body.triage .dismiss{display:none}
  .card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .card.sel .cbx{background:var(--accent);border-color:var(--accent)}
  .card.sel .cbx::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
    border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  #selbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);
    display:none;align-items:center;gap:16px;background:var(--surface-hi);border:1px solid var(--line-hi);
    padding:11px 18px;z-index:70;box-shadow:0 18px 50px rgba(0,0,0,.55);opacity:0;transition:opacity .18s,transform .18s}
  #selbar.show{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
  #selbar .ct{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink);font-variant-numeric:tabular-nums}
  #selbar button{background:none;border:none;cursor:pointer;font-family:var(--sans);font-size:11.5px;
    letter-spacing:.02em;color:var(--ink-mid);padding:0;transition:color .14s}
  #selbar button:hover{color:var(--ink)}
  #selbar .danger{color:var(--red)} #selbar .danger:hover{color:#e8543f}
  #selbar .dim{opacity:.4;cursor:default;pointer-events:none}
  #selbar .vr2{width:1px;height:16px;background:var(--line-hi)}

  .empty{color:var(--ink-faint);font-size:11px;letter-spacing:.04em;padding:14px 22px}

  footer{padding:18px 30px 26px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);
    letter-spacing:.04em}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);
    background:var(--surface-hi);border:1px solid var(--line-hi);color:var(--ink);
    padding:12px 18px;border-radius:0;font-size:12px;max-width:540px;z-index:60;opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 18px 50px rgba(0,0,0,.55)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .em{color:var(--strike)}
  #toast .sub{color:var(--ink-mid)}
  code{font-family:var(--mono);font-size:11px;color:var(--accent-dim)}
</style>
</head>
<body>
<header>
  <span class="brand">Task <b>Lord</b></span>
  <span class="vr"></span>
  <span class="kick">Rising&nbsp;Tides<br>Midnight&nbsp;Press</span>
  <span class="stat" id="stat">loading</span>
  <span class="grow"></span>
  <input class="search" id="search" placeholder="Filter" />
  <div class="toggles" id="toggles">
    <span class="tg on" data-src="session">Sessions</span>
    <span class="tg on" data-src="code">Code</span>
    <span class="tg on" data-src="business">Business</span>
    <span class="tg" data-staleonly="1">Stalled</span>
    <span class="vr"></span>
    <span class="tg" data-triage="1">Triage</span>
  </div>
</header>
<div class="rail" id="rail"></div>
<div class="board" id="board"></div>
<footer id="footer"></footer>
<div id="toast"></div>
<div id="selbar"></div>

<script src="board.js" onerror="window.__noboardjs=1"></script>
<script>
const COLS=[["backlog","Backlog"],["in_progress","In Progress"],["blocked","Blocked"],["done","Done"]];
let DATA={cards:[]};
const state={sources:new Set(["session","code","business"]),areas:new Set(),staleOnly:false,q:"",triage:false,selected:new Set()};
const TOKEN=window.TASKLORD_TOKEN||null;

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function idle(d){if(d==null)return"";if(d===0)return"today";if(d===1)return"1d idle";return d+"d idle";}

function cardHTML(c){
  const tok=[];
  if(c.identifier) tok.push(`<span class="ident">${esc(c.identifier)}</span>`);
  if(c.area) tok.push(`<span>${esc(c.area)}</span>`);
  if(c.type) tok.push(`<span>${esc(c.type)}</span>`);
  if(c.priority===1) tok.push(`<span class="prio urgent">Urgent</span>`);
  else if(c.priority===2) tok.push(`<span class="prio high">High</span>`);
  const eyebrow=`<div class="eyebrow">${tok.join('<span class="sep">·</span>')}</div>`;
  const summary=(c.left_off&&c.left_off!=="—")?`<div class="summary">${esc(c.left_off)}</div>`:"";
  const next=(c.next_step&&c.next_step!=="—")?`<div class="line next"><span class="k">Next</span>${esc(c.next_step)}</div>`:"";
  const blocked=c.blockers?`<div class="line blocked"><span class="k">Blocked</span>${esc(c.blockers)}</div>`:"";
  const g=[];
  if(c.days_idle!=null) g.push(`<span>${esc(idle(c.days_idle))||"today"}</span>`);
  if(c.git&&c.git.dirty) g.push(`<span>${c.git.dirty_count} uncommitted</span>`);
  const gutter=g.length?`<div class="gutter">${g.join("")}</div>`:"";
  const path=c.path?`<div class="path">${esc(c.path)}</div>`:"";
  const verb=c.source==="session"?"Continue in a fresh session":c.source==="business"?"Open in Trello":"Cook a fresh session";
  return `<div class="card s-${c.status}${state.selected.has(c.id)?' sel':''}" data-id="${esc(c.id)}">
    <span class="cbx" aria-hidden="true"></span>
    <button class="dismiss" title="Dismiss — won't return" onclick='dismiss(${JSON.stringify(c.id)},event)'>×</button>
    ${eyebrow}
    <div class="title">${esc(c.label)}</div>
    ${summary}${next}${blocked}${gutter}${path}
    <button class="act" onclick='cook(${JSON.stringify(c.id)})'>${verb}<span class="arrow">→</span></button>
  </div>`;
}

function render(){
  const q=state.q.toLowerCase();
  const cards=DATA.cards.filter(c=>{
    if(!state.sources.has(c.source))return false;
    if(state.areas.size && !state.areas.has(c.area))return false;
    if(state.staleOnly && !c.stale)return false;
    if(q && !((c.label||"").toLowerCase().includes(q)||(c.left_off||"").toLowerCase().includes(q)||(c.next_step||"").toLowerCase().includes(q)||(c.path||"").toLowerCase().includes(q)||(c.type||"").toLowerCase().includes(q)))return false;
    return true;
  });
  document.getElementById("board").innerHTML=COLS.map(([k,t],i)=>{
    const list=cards.filter(c=>c.status===k);
    const inner=list.length?`<div class="stack">${list.map(cardHTML).join("")}</div>`:`<div class="empty">Clear</div>`;
    return `<section class="col ${k}"><div class="col-h"><span class="ix">${String(i+1).padStart(2,"0")}</span><span class="sl">/</span><span class="t">${t}</span><span class="n">${list.length}</span><button class="colsel" data-col="${k}">select all</button></div>${inner}</section>`;
  }).join("");
  document.getElementById("stat").innerHTML=`${cards.length} of ${DATA.total||DATA.cards.length} &nbsp; ${fmt(DATA.generated_at)} &nbsp; <span class="live">${TOKEN?"live":"read-only"}</span>`;
}

function fmt(iso){if(!iso)return"";try{return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return"";}}
function toast(html,ms=4600){const t=document.getElementById("toast");t.innerHTML=html;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),ms);}

function cook(id){
  const c=DATA.cards.find(x=>x.id===id);if(!c)return;
  if(TOKEN){
    fetch(`/cook?id=${encodeURIComponent(id)}&token=${encodeURIComponent(TOKEN)}`).then(r=>r.json()).then(r=>{
      if(!r.ok){toast("Couldn't dispatch — "+esc(r.error||"failed"));return;}
      toast(`<span class="em">${esc(r.action)}</span> &nbsp; ${esc(c.label)}<br><span class="sub">Directive copied to clipboard — paste into the session.</span>`);
    }).catch(()=>toast("Launchpad not reachable"));
  } else {
    const cmd=c.path?`cd ${c.path} && claude`:"(open Trello)";
    navigator.clipboard.writeText(cmd).then(()=>toast(`<span class="em">Command copied</span><br><span class="sub">${esc(cmd)} — run <code>tasklord serve</code> for one-click dispatch</span>`));
  }
}

function dismiss(id,ev){
  if(ev) ev.stopPropagation();
  const c=DATA.cards.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Are you good on this task?\n\n${c.label}\n\nOK removes it for good — it won't return on future scans. Cancel keeps it.`))return;
  if(TOKEN){
    fetch(`/dismiss?id=${encodeURIComponent(id)}&token=${encodeURIComponent(TOKEN)}`).then(r=>r.json()).then(r=>{
      if(!r.ok){toast("Couldn't dismiss — "+esc(r.error||"failed"));return;}
      DATA.cards=DATA.cards.filter(x=>x.id!==id);render();
      toast(`<span class="em">Dismissed</span> &nbsp; ${esc(c.label)} won't return`);
    }).catch(()=>toast("Launchpad not reachable"));
  } else {DATA.cards=DATA.cards.filter(x=>x.id!==id);render();toast(`<span class="em">Hidden</span> <span class="sub">— serve the board to dismiss for good</span>`);}
}

function buildRail(){
  const wrap=document.getElementById("rail");const areas=DATA.areas||{};
  const keys=Object.keys(areas).filter(Boolean).sort((a,b)=>areas[b]-areas[a]);
  if(!keys.length){wrap.style.display="none";return;}
  wrap.style.display="flex";
  wrap.innerHTML=keys.map(a=>`<span class="area" data-area="${esc(a)}">${esc(a)}<span class="n">${areas[a]}</span></span>`).join("");
  wrap.onclick=e=>{const el=e.target.closest(".area");if(!el)return;const a=el.dataset.area;
    if(state.areas.has(a)){state.areas.delete(a);el.classList.remove("on");}else{state.areas.add(a);el.classList.add("on");}render();};
}

document.getElementById("toggles").addEventListener("click",e=>{
  const t=e.target.closest(".tg");if(!t)return;
  if(t.dataset.triage){state.triage=!state.triage;t.classList.toggle("on");
    document.body.classList.toggle("triage",state.triage);
    if(!state.triage)state.selected.clear();render();updateSelbar();return;}
  if(t.dataset.staleonly){state.staleOnly=!state.staleOnly;t.classList.toggle("on");}
  else{const s=t.dataset.src;if(state.sources.has(s)){state.sources.delete(s);t.classList.remove("on");}else{state.sources.add(s);t.classList.add("on");}}
  render();
});
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value;render();});

// ---- triage: multi-select + bulk clear ----
document.getElementById("board").addEventListener("click",e=>{
  if(!state.triage)return;
  const cs=e.target.closest(".colsel");
  if(cs){selectColumn(cs.dataset.col);return;}
  const card=e.target.closest(".card");
  if(card&&card.dataset.id){
    const id=card.dataset.id;
    if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);
    card.classList.toggle("sel",state.selected.has(id));
    updateSelbar();
  }
});
function selectColumn(k){
  const sec=document.querySelector(`section.col.${k}`);if(!sec)return;
  const cards=[...sec.querySelectorAll(".card")];if(!cards.length)return;
  const allSel=cards.every(c=>state.selected.has(c.dataset.id));
  cards.forEach(c=>{const id=c.dataset.id;if(allSel){state.selected.delete(id);c.classList.remove("sel");}else{state.selected.add(id);c.classList.add("sel");}});
  updateSelbar();
}
function selectAllVisible(){
  const cards=[...document.querySelectorAll("#board .card")];
  const allSel=cards.length&&cards.every(c=>state.selected.has(c.dataset.id));
  cards.forEach(c=>{const id=c.dataset.id;if(allSel){state.selected.delete(id);c.classList.remove("sel");}else{state.selected.add(id);c.classList.add("sel");}});
  updateSelbar();
}
function exitTriage(){state.triage=false;state.selected.clear();document.body.classList.remove("triage");
  document.querySelector('.tg[data-triage]')?.classList.remove("on");render();updateSelbar();}
function updateSelbar(){
  const bar=document.getElementById("selbar");
  if(!state.triage){bar.classList.remove("show");return;}
  const n=state.selected.size;
  bar.innerHTML=`<span class="ct">${n} selected</span>
    <button onclick="selectAllVisible()">Select all visible</button>
    <span class="vr2"></span>
    <button class="danger${n?"":" dim"}" onclick="clearSelected()">Clear ${n} permanently</button>
    <span class="vr2"></span>
    <button onclick="exitTriage()">Exit triage</button>`;
  bar.classList.add("show");
}
function clearSelected(){
  const ids=[...state.selected];
  if(!ids.length){toast("Nothing selected");return;}
  if(!confirm(`Permanently clear ${ids.length} task${ids.length>1?"s":""}?\n\nThey won't return on future scans.`))return;
  if(TOKEN){
    fetch(`/dismiss_bulk?ids=${encodeURIComponent(ids.join(","))}&reason=triage&token=${encodeURIComponent(TOKEN)}`).then(r=>r.json()).then(r=>{
      if(!r.ok){toast("Couldn't clear — "+esc(r.error||"failed"));return;}
      DATA.cards=DATA.cards.filter(x=>!state.selected.has(x.id));
      state.selected.clear();render();updateSelbar();
      toast(`<span class="em">Cleared</span> &nbsp; ${r.dismissed} removed for good`);
    }).catch(()=>toast("Launchpad not reachable"));
  } else {
    DATA.cards=DATA.cards.filter(x=>!state.selected.has(x.id));
    state.selected.clear();render();updateSelbar();
    toast(`<span class="em">Hidden</span> <span class="sub">— serve the board to clear for good</span>`);
  }
}

function boot(d){DATA=d;buildRail();
  document.body.classList.add("booting");render();
  setTimeout(()=>document.body.classList.remove("booting"),1100);
  document.getElementById("footer").textContent=`${d.total} tasks · ${Object.entries(d.counts||{}).map(([k,v])=>`${v} ${k.replace("_"," ")}`).join("  ·  ")}`;}
fetch("board.json?_="+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json();}).then(boot)
  .catch(()=>{if(window.BOARD){boot(window.BOARD);return;}document.getElementById("board").innerHTML=`<div class="empty">No data — run <code>tasklord harvest</code>, then reload.</div>`;});
</script>
</body>
</html>
